  <g font-family="Arial,sans-serif" font-size="17" fill="#2e3440" text-anchor="middle"><text x="765" y="197">IDENTITY</text><text x="995" y="197">DATA</text><text x="765" y="447">RUNTIME</text><text x="995" y="447">SUPPLIERS</text></g>
  <rect x="740" y="275" width="280" height="80" rx="10" fill="#2e3440"/>
  <text x="880" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#eceff4">BUSINESS CONTINUITY</text>
